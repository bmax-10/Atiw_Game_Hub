<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <button id="restart" type="button">Neue Runde</button>
      </header>
      <div class="canvas-wrap">
        <canvas id="game" width="600" height="600" aria-label="Snake Spielfeld"></canvas>
        <section id="game-over" class="game-over" hidden>
          <p>GAME OVER</p>
          <strong id="final-score">0 Punkte</strong>
          <button id="play-again" type="button">Nochmal spielen</button>
        </section>
      </div>
      <p class="hint">WASD oder Pfeiltasten zum Steuern</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
